<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Google Sheets Presentation Canvas</title>
  <style>
    :root {
      --card-w: 1400px;
      --card-h: 788px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      touch-action: none;
    }

    /* ================= SETUP PAGE ================= */
    #setup-page {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 60;
      overflow-y: auto;
      padding: 28px 20px 60px;
      display: none;
      touch-action: auto;
    }
    #setup-page.visible { display: block; }

    .setup-container { max-width: 860px; margin: 0 auto; }

    .setup-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .setup-top h1 { font-size: 24px; color: #f8fafc; }
    .setup-top p { font-size: 14px; color: #94a3b8; margin-top: 4px; }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .panel h2 { font-size: 16px; color: #38bdf8; margin-bottom: 14px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 720px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #38bdf8; }

    .hint { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }
    .sheet-list { display: flex; flex-direction: column; gap: 10px; }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .sheet-row-info { min-width: 0; flex: 1; }
    .sheet-row-title { font-weight: 700; font-size: 15px; color: #f8fafc; }
    .sheet-row-url {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    .sheet-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 28px;
      color: #64748b;
      font-size: 14px;
      border: 1px dashed #334155;
      border-radius: 8px;
    }

    .settings-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ================= FULL-SCREEN CANVAS VIEW ================= */
    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      gap: 40px;
      padding: 40px;
      transform-origin: 0 0;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    #canvas.dragging { transition: none; }

    .sheet-card {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      background: #1e293b;
      border: 4px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      transition: border-color 0.3s, border-width 0.3s, border-radius 0.3s;
    }

    body.is-zoomed .sheet-card.active {
      border-width: 0;
      border-radius: 0;
    }

    .sheet-header {
      height: 54px;
      padding: 0 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      transition: height 0.3s, opacity 0.3s;
    }

    body.is-zoomed .sheet-card.active .sheet-header {
      height: 0;
      border-bottom: none;
      opacity: 0;
    }

    .sheet-title { font-size: 22px; font-weight: 700; color: #f8fafc; }
    .sheet-badge {
      font-size: 14px;
      background: #334155;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .iframe-wrap { position: relative; flex: 1; background: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

    .click-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      cursor: zoom-in;
      z-index: 5;
    }
    .click-overlay:hover { background: rgba(56, 189, 248, 0.08); }
    .sheet-card.active .click-overlay { display: none; }

    /* Drag-to-Pan Shield (Active only when Pan Mode is ON) */
    #pan-shield {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
      cursor: grab;
      background: transparent;
    }
    body.pan-mode #pan-shield { display: block; }
    body.pan-mode #pan-shield:active { cursor: grabbing; }

    /* ================= FLOATING TOP-RIGHT SLIDE CONTROLS ================= */
    #zoom-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid #334155;
      padding: 6px 8px;
      border-radius: 10px;
      z-index: 30;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.3s, transform 0.3s;
    }

    body.is-zoomed #zoom-controls {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #zoom-slide-label {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      padding: 0 6px;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= FLOATING BOTTOM-RIGHT ZOOM & SCROLL PAD ================= */
    #nav-pad {
      position: fixed;
      bottom: 68px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 12px;
      z-index: 30;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: bottom 0.35s ease;
    }

    body.is-zoomed #nav-pad {
      bottom: 14px;
    }

    .zoom-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #zoom-percent {
      min-width: 48px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      cursor: pointer;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(3, 32px);
      gap: 4px;
    }

    .dpad button {
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* ================= BOTTOM TOOLBAR (OVERVIEW ONLY) ================= */
    #toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(2, 6, 23, 0.94);
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      z-index: 20;
      overflow-x: auto;
      transition: transform 0.35s ease;
    }

    body.is-zoomed #toolbar { transform: translateY(100%); }

    /* ================= BUTTONS ================= */
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover { background: #334155; }
    button.primary, button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    button.primary:hover { background: #0369a1; }
    button.warn-active {
      background: #d97706;
      border-color: #fbbf24;
      color: #ffffff;
    }
    button.danger {
      background: #450a0a;
      border-color: #991b1b;
      color: #fca5a5;
    }
    button.danger:hover { background: #7f1d1d; }

    .divider { width: 1px; height: 22px; background: #334155; margin: 0 4px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- ================= SETUP / MANAGE PAGE ================= -->
  <div id="setup-page">
    <div class="setup-container">
      <div class="setup-top">
        <div>
          <h1>📊 Google Sheets Canvas Setup</h1>
          <p>Add your spreadsheet links below, then launch the zoomable canvas.</p>
        </div>
        <button class="primary" onclick="launchCanvas()" style="padding: 12px 20px; font-size: 15px;">
          ▶ Launch Canvas
        </button>
      </div>

      <div class="panel">
        <h2>➕ Add Spreadsheet</h2>
        <div class="form-grid">
          <div>
            <label for="input-title">Sheet Title</label>
            <input type="text" id="input-title" placeholder="e.g. Daily Production Output" />
          </div>
          <div>
            <label for="input-url">Google Sheets Link or Embed Code</label>
            <input type="text" id="input-url" placeholder="Paste normal link or Publish-to-web iframe..." />
          </div>
          <button class="primary" onclick="addSheet()" style="height: 41px;">+ Add</button>
        </div>
        <p class="hint">
          💡 Paste any normal Google Sheets URL (auto-formats to clean <code>rm=minimal</code> mode) or paste the full <code>&lt;iframe&gt;</code> code from <em>File → Share → Publish to web</em>.
        </p>
      </div>

      <div class="panel">
        <h2>📋 Saved Spreadsheets (<span id="sheet-count">0</span>)</h2>
        <div id="sheet-list" class="sheet-list"></div>
      </div>

      <div class="panel">
        <div class="settings-bar">
          <div style="display:flex; align-items:center; gap:10px;">
            <label for="col-select" style="margin:0;">Canvas Columns:</label>
            <select id="col-select" style="width:auto;" onchange="saveColumns()">
              <option value="auto">Auto</option>
              <option value="1">1 Column</option>
              <option value="2">2 Columns</option>
              <option value="3">3 Columns</option>
              <option value="4">4 Columns</option>
            </select>
          </div>
          <div style="display:flex; gap:8px;">
            <button onclick="exportConfig()">⬇ Export Backup</button>
            <button onclick="document.getElementById('import-file').click()">⬆ Import Backup</button>
            <input type="file" id="import-file" accept=".json" style="display:none" onchange="importConfig(event)" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= CANVAS PRESENTATION VIEW ================= -->
  <div id="viewport">
    <div id="canvas"></div>
    <div id="pan-shield"></div>
  </div>

  <!-- Floating Top-Right Slide Controls (Zoomed Mode) -->
  <div id="zoom-controls">
    <span id="zoom-slide-label">Slide</span>
    <button onclick="prevSheet()" title="Previous Slide">◀</button>
    <button onclick="nextSheet()" title="Next Slide">▶</button>
    <button class="primary" onclick="resetZoom()" title="Back to Overview (Esc / 0)">← Overview</button>
    <button onclick="toggleFullscreen()" title="Browser Fullscreen">⛶</button>
  </div>

  <!-- Floating Bottom-Right Zoom & Scroll/Pan Pad -->
  <div id="nav-pad">
    <div class="zoom-row">
      <button onclick="adjustZoom(-0.25)" title="Zoom Out">−</button>
      <span id="zoom-percent" onclick="resetPanZoom()" title="Click to reset to 100%">100%</span>
      <button onclick="adjustZoom(0.25)" title="Zoom In">+</button>
    </div>
    <div class="dpad">
      <div></div>
      <button onclick="panView(0, 1)" title="Scroll Up">↑</button>
      <div></div>
      <button onclick="panView(1, 0)" title="Scroll Left">←</button>
      <button onclick="resetPanZoom()" title="Center & Reset Zoom">●</button>
      <button onclick="panView(-1, 0)" title="Scroll Right">→</button>
      <div></div>
      <button onclick="panView(0, -1)" title="Scroll Down">↓</button>
      <div></div>
    </div>
    <button id="btn-pan-mode" onclick="togglePanMode()" style="width:100%; font-size:12px;">
      ✋ Drag Pan: OFF
    </button>
  </div>

  <!-- Bottom Toolbar (Overview Mode) -->
  <div id="toolbar">
    <button onclick="openSetup()">⚙️ Manage</button>
    <div class="divider"></div>
    <button id="btn-overview" class="active" onclick="resetZoom()">Overview [0]</button>
    <div id="sheet-buttons" style="display:flex; gap:6px;"></div>
    <div class="divider"></div>
    <button onclick="reloadAll()">↻ Refresh</button>
    <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>

  <script>
    const STORAGE_KEY = "gsheets_canvas_items_v1";
    const COLS_KEY = "gsheets_canvas_cols_v1";
    const TOOLBAR_H = 56;

    let sheets = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let gridCols = localStorage.getItem(COLS_KEY) || "auto";
    let activeIndex = -1; // -1 = Overview
    let zoomMult = 1;     // 0.5 to 3.0
    let panX = 0;
    let panY = 0;
    let panMode = false;

    const setupPage = document.getElementById("setup-page");
    const canvas = document.getElementById("canvas");
    const panShield = document.getElementById("pan-shield");
    const btnContainer = document.getElementById("sheet-buttons");
    const zoomLabel = document.getElementById("zoom-slide-label");
    const zoomPercent = document.getElementById("zoom-percent");
    const btnPanMode = document.getElementById("btn-pan-mode");

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function normalizeSheetUrl(raw) {
      let input = raw.trim();
      const iframeMatch = input.match(/src=["']([^"']+)["']/i);
      if (iframeMatch) input = iframeMatch[1];
      if (input.includes("/pubhtml") || input.includes("/pub?")) return input;

      const idMatch = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (idMatch) {
        const sheetId = idMatch[1];
        const gidMatch = input.match(/[#&?]gid=([0-9]+)/);
        const gid = gidMatch ? gidMatch[1] : "0";
        return `https://docs.google.com/spreadsheets/d/${sheetId}/edit?gid=${gid}&rm=minimal`;
      }
      return input;
    }

    function syncCardSize() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cardW = 1400;
      const cardH = Math.max(550, Math.min(2600, Math.round(cardW * (vh / vw))));
      document.documentElement.style.setProperty("--card-w", `${cardW}px`);
      document.documentElement.style.setProperty("--card-h", `${cardH}px`);
    }

    // ================= SETUP PAGE =================
    function openSetup() {
      setPanMode(false);
      document.body.classList.remove("is-zoomed");
      renderSetupList();
      document.getElementById("col-select").value = gridCols;
      setupPage.classList.add("visible");
    }

    function launchCanvas() {
      if (sheets.length === 0) return alert("Please add at least 1 Google Sheets link first.");
      setupPage.classList.remove("visible");
      syncCardSize();
      renderCanvas();
      setTimeout(resetZoom, 50);
    }

    function addSheet() {
      const titleInput = document.getElementById("input-title");
      const urlInput = document.getElementById("input-url");
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) return alert("Please paste a Google Sheets link.");

      const cleanUrl = normalizeSheetUrl(rawUrl);
      if (!cleanUrl.startsWith("http")) {
        return alert("Invalid URL. Please paste a valid Google Sheets link starting with https://");
      }

      const title = titleInput.value.trim() || `Spreadsheet ${sheets.length + 1}`;
      sheets.push({ title, url: cleanUrl });
      saveData();

      titleInput.value = "";
      urlInput.value = "";
      titleInput.focus();
      renderSetupList();
    }

    function deleteSheet(index) {
      sheets.splice(index, 1);
      saveData();
      renderSetupList();
    }

    function moveSheet(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= sheets.length) return;
      [sheets[index], sheets[target]] = [sheets[target], sheets[index]];
      saveData();
      renderSetupList();
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sheets)); }
    function saveColumns() {
      gridCols = document.getElementById("col-select").value;
      localStorage.setItem(COLS_KEY, gridCols);
    }

    function renderSetupList() {
      const list = document.getElementById("sheet-list");
      document.getElementById("sheet-count").textContent = sheets.length;

      if (sheets.length === 0) {
        list.innerHTML = `<div class="empty-state">No spreadsheets added yet. Paste your first link above.</div>`;
        return;
      }

      list.innerHTML = sheets.map((s, i) => `
        <div class="sheet-row">
          <div class="sheet-row-info">
            <div class="sheet-row-title">${i + 1}. ${escapeHtml(s.title)}</div>
            <div class="sheet-row-url">${escapeHtml(s.url)}</div>
          </div>
          <div class="sheet-row-actions">
            <button onclick="moveSheet(${i}, -1)" title="Move Up">↑</button>
            <button onclick="moveSheet(${i}, 1)" title="Move Down">↓</button>
            <button class="danger" onclick="deleteSheet(${i})" title="Remove">✕</button>
          </div>
        </div>
      `).join("");
    }

    function exportConfig() {
      const data = JSON.stringify({ gridCols, sheets }, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sheets-canvas-backup.json";
      a.click();
    }

    function importConfig(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.sheets)) {
            sheets = parsed.sheets;
            if (parsed.gridCols) gridCols = parsed.gridCols;
            saveData();
            localStorage.setItem(COLS_KEY, gridCols);
            document.getElementById("col-select").value = gridCols;
            renderSetupList();
            alert("Backup imported successfully!");
          }
        } catch { alert("Invalid backup file."); }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    // ================= CANVAS RENDER & TRANSFORM ENGINE =================
    function getColumnCount() {
      if (gridCols !== "auto") return parseInt(gridCols, 10);
      if (sheets.length <= 1) return 1;
      if (sheets.length <= 4) return 2;
      if (sheets.length <= 9) return 3;
      return 4;
    }

    function renderCanvas() {
      const cols = getColumnCount();
      canvas.style.gridTemplateColumns = `repeat(${cols}, var(--card-w))`;
      canvas.innerHTML = "";
      btnContainer.innerHTML = "";

      sheets.forEach((sheet, i) => {
        const card = document.createElement("div");
        card.className = "sheet-card";
        card.id = `card-${i}`;
        card.innerHTML = `
          <div class="sheet-header" onclick="zoomTo(${i})">
            <span class="sheet-title">${escapeHtml(sheet.title)}</span>
            <span class="sheet-badge">Key [${i + 1}]</span>
          </div>
          <div class="iframe-wrap">
            <div class="click-overlay" onclick="zoomTo(${i})" title="Click to zoom full screen"></div>
            <iframe src="${sheet.url}" loading="lazy"></iframe>
          </div>
        `;
        canvas.appendChild(card);

        const btn = document.createElement("button");
        btn.id = `btn-${i}`;
        btn.textContent = `${i + 1}`;
        btn.title = sheet.title;
        btn.onclick = () => zoomTo(i);
        btnContainer.appendChild(btn);
      });
    }

    function applyTransform() {
      if (sheets.length === 0) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      zoomPercent.textContent = `${Math.round(zoomMult * 100)}%`;

      if (activeIndex === -1) {
        const usableH = vh - TOOLBAR_H;
        const cw = canvas.offsetWidth;
        const ch = canvas.offsetHeight;
        const baseScale = Math.min((vw - 24) / cw, (usableH - 24) / ch);
        const scale = baseScale * zoomMult;
        const tx = (vw - cw * scale) / 2 + panX;
        const ty = (usableH - ch * scale) / 2 + panY;
        canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      } else {
        const card = document.getElementById(`card-${activeIndex}`);
        if (!card) return;
        const baseScale = Math.min(vw / card.offsetWidth, vh / card.offsetHeight);
        const scale = baseScale * zoomMult;
        const cx = card.offsetLeft + card.offsetWidth / 2;
        const cy = card.offsetTop + card.offsetHeight / 2;
        const tx = vw / 2 - cx * scale + panX;
        const ty = vh / 2 - cy * scale + panY;
        canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      }
    }

    function resetZoom() {
      if (sheets.length === 0) return;
      activeIndex = -1;
      zoomMult = 1;
      panX = 0;
      panY = 0;
      setPanMode(false);
      document.body.classList.remove("is-zoomed");
      updateActiveUI();
      applyTransform();
    }

    function zoomTo(index) {
      if (index < 0 || index >= sheets.length) return;
      activeIndex = index;
      zoomMult = 1;
      panX = 0;
      panY = 0;
      document.body.classList.add("is-zoomed");
      zoomLabel.textContent = `${index + 1}/${sheets.length} · ${sheets[index].title}`;
      updateActiveUI();
      applyTransform();
    }

    function adjustZoom(delta) {
      zoomMult = Math.max(0.5, Math.min(3.0, Math.round((zoomMult + delta) * 100) / 100));
      applyTransform();
    }

    function panView(dirX, dirY) {
      const step = Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.25);
      panX += dirX * step;
      panY += dirY * step;
      applyTransform();
    }

    function resetPanZoom() {
      zoomMult = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function setPanMode(enabled) {
      panMode = enabled;
      document.body.classList.toggle("pan-mode", panMode);
      btnPanMode.classList.toggle("warn-active", panMode);
      btnPanMode.textContent = panMode ? "✋ Drag Pan: ON" : "✋ Drag Pan: OFF";
    }

    function togglePanMode() { setPanMode(!panMode); }

    // Pointer drag handler (works on Mouse + Android Touch)
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    panShield.addEventListener("pointerdown", (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      canvas.classList.add("dragging");
      panShield.setPointerCapture(e.pointerId);
    });

    panShield.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });

    panShield.addEventListener("pointerup", () => {
      isDragging = false;
      canvas.classList.remove("dragging");
    });

    function nextSheet() { if (sheets.length) zoomTo((activeIndex + 1) % sheets.length); }
    function prevSheet() { if (sheets.length) zoomTo((activeIndex - 1 + sheets.length) % sheets.length); }

    function updateActiveUI() {
      document.getElementById("btn-overview").classList.toggle("active", activeIndex === -1);
      sheets.forEach((_, i) => {
        const card = document.getElementById(`card-${i}`);
        const btn = document.getElementById(`btn-${i}`);
        if (card) card.classList.toggle("active", activeIndex === i);
        if (btn) btn.classList.toggle("active", activeIndex === i);
      });
    }

    function reloadAll() {
      document.querySelectorAll("iframe").forEach(frame => { frame.src = frame.src; });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    document.addEventListener("keydown", (e) => {
      if (setupPage.classList.contains("visible")) {
        if (e.key === "Enter" && document.activeElement.id === "input-url") addSheet();
        return;
      }
      if (e.key === "Escape" || e.key === "0") resetZoom();
      if (e.key === "+" || e.key === "=") adjustZoom(0.25);
      if (e.key === "-") adjustZoom(-0.25);
      if (e.key === "ArrowRight" && activeIndex !== -1) nextSheet();
      if (e.key === "ArrowLeft" && activeIndex !== -1) prevSheet();
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= sheets.length) zoomTo(num - 1);
    });

    window.addEventListener("resize", () => {
      syncCardSize();
      if (!setupPage.classList.contains("visible")) applyTransform();
    });

    window.addEventListener("load", () => {
      syncCardSize();
      if (sheets.length === 0) {
        openSetup();
      } else {
        renderCanvas();
        resetZoom();
      }
    });
  </script>
</body>
</html>
